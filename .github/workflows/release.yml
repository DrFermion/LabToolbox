name: Build & Release (Win + macOS)

on:
  push:
    tags:
      - "v*"          # 推送 v0.1.0 等标签时触发
  workflow_dispatch:  # 也支持手动触发 (仅构建, 不发布 — 发布需打 tag)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LabToolbox-Windows
            zipname: LabToolbox-Windows
            files: |
              dist/LabToolbox-Windows.zip
              installer/*.exe
          - os: macos-latest
            artifact: LabToolbox-macOS
            zipname: LabToolbox-macOS
            # 只上传 DMG: zip 与 DMG 装的是同一份 .app, 两份一起传曾把上传体积翻倍,
            # 2026-09-20 v0.1.7 那次就是在 ~328 MB 处 ETIMEDOUT 挂掉的。
            files: |
              dist/LabToolbox-macOS.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller numpy scipy matplotlib pandas openpyxl statsmodels opencv-python Pillow

      - name: Build with PyInstaller
        run: pyinstaller labtoolbox.spec --noconfirm

      # ---------- Windows: Inno Setup 安装向导 ----------
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 定位 ISCC.exe (choco 安装路径)
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Output "ISCC: $($iscc.FullName)"
          # 版本号从 tag 提取 (v0.1.4 -> 0.1.4), 传给 iscc 的 MyAppVersion
          $tagVer = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Output "安装包版本: $tagVer"
          & $iscc.FullName "/DMyAppVersion=$tagVer" "installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          Get-ChildItem installer/*.exe | ForEach-Object { Write-Output "INSTALLER: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LabToolbox/* -DestinationPath dist/${{ matrix.zipname }}.zip -Force

      # ---------- macOS: DMG ----------
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "LabToolbox" -srcfolder dist/LabToolbox.app -ov -format UDZO dist/${{ matrix.zipname }}.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          # zip/dmg 已经压过, 再压一遍纯浪费 CPU 和时间
          compression-level: 0
          # 产物在 Release 页面还有一份, 这里只留两周, 免得 Actions 存储越堆越大
          retention-days: 14
          if-no-files-found: warn

  release:
    needs: build
    # 手点 workflow_dispatch 时只构建、不发布 (发布一律走 tag)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: labtoolbox ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.exe
