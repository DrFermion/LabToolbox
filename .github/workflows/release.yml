name: Build & Release (Windows x64 + macOS Intel + macOS Apple Silicon)

# Builds one desktop app per platform, with ImageJ 1.54 + a native Java runtime
# bundled inside the Windows installer / macOS DMGs (no runtime downloads).
# Releases are NOT code-signed: no Authenticode certificate and no Apple
# Developer ID / notarization. See docs/INSTALL.md for the unsigned-install
# workarounds (SmartScreen / Gatekeeper) and how to add signing later.
on:
  push:
    tags:
      - "v*"          # push a v* tag to build and publish a GitHub Release
  workflow_dispatch:  # manual run = build only, no release (releases need a tag)

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            platform: windows
            artifact: LabToolbox-Windows-x64
            files: |
              dist/LabToolbox-Windows-x64.zip
              installer/LabToolbox-Setup-*.exe
          # GitHub runner labels (actions/runner-images, checked 2026-11-10):
          #   macos-15-intel = macOS 15 x86_64 (standard Intel runner)
          #   macos-15      = macOS 15 arm64  (Apple Silicon; "macos-latest" also arm64 nowadays)
          # macos-14 Intel images were retired on 2026-11-02, so Intel uses macos-15-intel.
          - name: macOS-Intel
            os: macos-15-intel
            platform: macos-intel
            artifact: LabToolbox-macOS-Intel
            dmg: LabToolbox-macOS-Intel.dmg
            volname: LabToolbox (Intel)
            files: |
              dist/LabToolbox-macOS-Intel.dmg
          - name: macOS-AppleSilicon
            os: macos-15
            platform: macos-arm64
            artifact: LabToolbox-macOS-AppleSilicon
            dmg: LabToolbox-macOS-AppleSilicon.dmg
            volname: LabToolbox (Apple Silicon)
            files: |
              dist/LabToolbox-macOS-AppleSilicon.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # One version for the whole release: the git tag (vX.Y.Z) when building a
      # release, otherwise pyproject.toml (workflow_dispatch / branch builds).
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          raw="${GITHUB_REF_NAME}"
          version=""
          case "$raw" in
            v*) version="${raw#v}" ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            version="$(python - <<'PY'
          import re
          text = open("pyproject.toml", encoding="utf-8").read()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          print(match.group(1) if match else "0.0.0")
          PY
          )"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Build version: $version"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller \
            "numpy>=1.24" "scipy>=1.10" "matplotlib>=3.7" "pandas>=2.0" "openpyxl>=3.1" \
            "statsmodels>=0.14" "opencv-python>=4.8" "Pillow>=10.0" "tifffile>=2023.0"
          # igor = Bruker .ibw direct read (PyPI "igor" is an empty shell; must come from GitHub)
          python -m pip install "igor @ git+https://github.com/wking/igor"

      # Assembles vendor/imagej = ImageJ 1.54 ij.jar + platform-native Temurin 11 JRE.
      - name: Fetch bundled ImageJ + Java runtime
        shell: bash
        run: python scripts/fetch_imagej.py --platform ${{ matrix.platform }}

      - name: Build application (PyInstaller)
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller labtoolbox.spec --noconfirm --clean

      # Fails the build if ImageJ/JRE/macro/igor are missing or the bundled JRE
      # reports the wrong CPU architecture (e.g. x86_64 in an Apple Silicon DMG).
      - name: Verify bundled ImageJ / JRE / macro / igor
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/verify_bundle.py --platform ${{ matrix.platform }}

      # ---------- Windows: unsigned Inno Setup installer + portable zip ----------
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer (unsigned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Output "ISCC: $($iscc.FullName)"
          $version = "${{ steps.version.outputs.version }}"
          # Installer is unsigned on purpose (no Authenticode certificate).
          & $iscc.FullName "/DMyAppVersion=$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          Get-ChildItem installer/*.exe | ForEach-Object { Write-Output "INSTALLER: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Create portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "dist/LabToolbox-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          Push-Location dist
          try {
            if (Test-Path $sevenZip) {
              & $sevenZip a -tzip -mx=5 "LabToolbox-Windows-x64.zip" "LabToolbox"
              if ($LASTEXITCODE -ne 0) { Write-Error "7z failed"; exit $LASTEXITCODE }
            } else {
              Compress-Archive -Path "LabToolbox/*" -DestinationPath "LabToolbox-Windows-x64.zip" -Force
            }
          } finally {
            Pop-Location
          }
          Write-Output "ZIP: $((Get-Item $zip).Length / 1MB) MB"

      # ---------- macOS: ad-hoc signed (NOT notarized) .app -> DMG ----------
      # Ad-hoc signature is required for arm64 binaries to run at all; it is not
      # an Apple Developer ID signature and Gatekeeper still warns on first open.
      - name: Prepare macOS JRE bundle metadata for codesign
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          app = Path('dist/LabToolbox.app')
          # PyInstaller splits the bundled JRE between Contents/Frameworks and
          # Contents/Resources. codesign treats the .jre directory as a nested bundle
          # and fails on its symlinked/moved Info.plist and _CodeSignature. The JRE is
          # launched directly (Contents/Home/bin/java), so remove the bundle metadata;
          # then --deep can sign every Mach-O file (java, libjli, dylibs) normally.
          for rel in ('Contents/Frameworks/imagej/jre/Contents',
                      'Contents/Resources/imagej/jre/Contents'):
              base = app / rel
              if not base.exists():
                  continue
              info = base / 'Info.plist'
              if info.is_symlink() or info.exists():
                  info.unlink()
              sig = base / '_CodeSignature'
              if sig.is_symlink() or sig.is_file():
                  sig.unlink()
              elif sig.is_dir():
                  shutil.rmtree(sig)
          print('JRE bundle metadata removed for codesign')
          PY

      - name: Ad-hoc sign macOS app (unsigned release, no Developer ID)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/LabToolbox.app
          codesign --verify --strict --verbose=2 dist/LabToolbox.app
          echo "Ad-hoc signature OK (not notarized; users must right-click > Open on first launch)"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "${{ matrix.volname }}" -srcfolder dist/LabToolbox.app -ov -format UDZO "dist/${{ matrix.dmg }}"
          ls -lh "dist/${{ matrix.dmg }}"

      - name: Report artifact sizes
        shell: bash
        run: |
          echo "### ${{ matrix.name }} artifacts" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.zip dist/*.dmg installer/*.exe; do
            [ -f "$f" ] || continue
            echo "- $(basename "$f"): $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          du -sh dist/LabToolbox 2>/dev/null || du -sh dist/LabToolbox.app 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    # Manual workflow_dispatch runs build only; releases are created from v* tags.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        shell: bash
        run: find artifacts -type f -exec ls -lh {} +

      # Release notes must name the Windows installer that was actually built, so
      # the version comes from the tag (vX.Y.Z -> X.Y.Z) and the body is written to
      # a file that can be checked before it is published. The job fails when the
      # filename named in the notes is not derived from the tag or is missing from
      # the downloaded artifacts, instead of publishing a placeholder/wrong name.
      - name: Generate release notes for this tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::tag '$GITHUB_REF_NAME' does not give a X.Y.Z version (expected vX.Y.Z)"
            exit 1
          fi
          expected="LabToolbox-Setup-${version}.exe"
          notes="$RUNNER_TEMP/release-notes.md"
          # Quoted heredoc: keep the markdown backticks literal; the tag-derived
          # version is injected with sed afterwards (avoids touching the table).
          cat > "$notes" <<'EOF'
          LabToolbox ${{ github.ref_name }} — one desktop app, Windows x64 + macOS Intel + macOS Apple Silicon.

          **These builds are unsigned.** There is no Windows Authenticode certificate and no
          Apple Developer ID signature/notarization, so Windows SmartScreen and macOS Gatekeeper
          will warn on first launch. See docs/INSTALL.md in this tag for the exact workarounds.

          | Platform | Download | Notes |
          |---|---|---|
          | Windows x64 | `LabToolbox-Setup-__VERSION__.exe` (installer) or `LabToolbox-Windows-x64.zip` (portable) | SmartScreen: More info → Run anyway |
          | macOS Intel | `LabToolbox-macOS-Intel.dmg` | For x86_64 Macs |
          | macOS Apple Silicon | `LabToolbox-macOS-AppleSilicon.dmg` | For M1/M2/M3/M4 Macs |

          The installer/DMG already include ImageJ 1.54 and a private Java runtime for the
          LIVE/DEAD cell counter — no Python, ImageJ or Java installation is needed, and the
          app never downloads anything on first use.

          Install guide: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md
          Module docs: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/modules/README.md
          EOF
          sed -i "s/__VERSION__/${version}/g" "$notes"
          if grep -q '__VERSION__' "$notes"; then
            echo "::error::release notes still contain the __VERSION__ placeholder"
            exit 1
          fi
          echo "----- generated release notes -----"
          cat "$notes"
          installer="$(grep -oE 'LabToolbox-Setup-[0-9]+(\.[0-9]+)*\.exe' "$notes" | head -n 1 || true)"
          if [ -z "$installer" ]; then
            echo "::error::release notes do not name a Windows installer"
            exit 1
          fi
          if [ "$installer" != "$expected" ]; then
            echo "::error::release notes name '$installer' but tag '$GITHUB_REF_NAME' requires '$expected'"
            exit 1
          fi
          # The artifacts keep the paths upload-artifact recorded, so the Windows
          # installer lands in a subdirectory (artifacts/installer/...), never at
          # the artifacts root: find it recursively instead of assuming a layout.
          installer_path="$(find artifacts -type f -name "$installer" -print -quit)"
          if [ -z "$installer_path" ]; then
            echo "::error::'$installer' is named in the release notes but is missing from the release artifacts:"
            find artifacts -type f 2>/dev/null | sort || true
            exit 1
          fi
          echo "Release notes verified: '$installer_path' matches the tag and exists"

      - name: Create release (unsigned builds)
        uses: softprops/action-gh-release@v2
        with:
          name: LabToolbox ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.exe