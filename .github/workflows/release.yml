name: Build & Release (Win + macOS)

on:
  push:
    tags:
      - "v*"          # 推送 v0.1.0 等标签时触发
  workflow_dispatch:  # 也支持手动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LabToolbox-Windows
            zipname: LabToolbox-Windows
          - os: macos-latest
            artifact: LabToolbox-macOS
            zipname: LabToolbox-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller numpy scipy matplotlib pandas openpyxl statsmodels opencv-python Pillow

      - name: Build with PyInstaller
        run: pyinstaller labtoolbox.spec --noconfirm

      # ---------- Windows: Inno Setup 安装向导 ----------
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 定位 ISCC.exe (choco 安装路径)
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Output "ISCC: $($iscc.FullName)"
          & $iscc.FullName "installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          Get-ChildItem installer/*.exe | ForEach-Object { Write-Output "INSTALLER: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LabToolbox/* -DestinationPath dist/${{ matrix.zipname }}.zip -Force

      # ---------- macOS: DMG ----------
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "LabToolbox" -srcfolder dist/LabToolbox.app -ov -format UDZO dist/${{ matrix.zipname }}.dmg

      - name: Create zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          zip -r ${{ matrix.zipname }}.zip LabToolbox.app
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.zipname }}.zip
            dist/${{ matrix.zipname }}.dmg
            installer/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: labtoolbox ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.exe
