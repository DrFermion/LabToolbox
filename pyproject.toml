[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labtoolbox"
version = "0.1.16"
description = "实验室工具箱 - Biomedical lab analysis tools (growth curves, LIPSS/DLOA, XDLVO, LIVE/DEAD, contact angle)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ruinong Pan (DrFermion)" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
    "tifffile>=2023.0",
]

[project.optional-dependencies]
image = ["opencv-python>=4.8", "Pillow>=10.0"]
r = ["rpy2>=3.5"]
# .ibw (Bruker AFM) direct read: the real igor package lives on GitHub (the PyPI
# "igor" package is an empty shell - do not install it).
surf = ["igor @ git+https://github.com/wking/igor"]
# Everything needed to reproduce the release builds locally:
#   pip install -e ".[build]"
#   python scripts/fetch_imagej.py
#   pyinstaller labtoolbox.spec --noconfirm
build = [
    "pyinstaller>=6.0",
    "igor @ git+https://github.com/wking/igor",
]

[project.scripts]
labtoolbox = "labtoolbox.cli:main"

[project.urls]
Homepage = "https://github.com/DrFermion/LabToolbox"
Releases = "https://github.com/DrFermion/LabToolbox/releases"
Documentation = "https://github.com/DrFermion/LabToolbox/blob/master/docs/modules/README.md"
Issues = "https://github.com/DrFermion/LabToolbox/issues"

[tool.setuptools]
packages = ["labtoolbox",
            "labtoolbox.common",
            "labtoolbox.growth_curve",
            "labtoolbox.lipss_dloa",
            "labtoolbox.xdlvo",
            "labtoolbox.livedead",
            "labtoolbox.livedead_cellcounter",
            "labtoolbox.contact_angle",
            "labtoolbox.contact_schematic",
            "labtoolbox.semtexture",
            "labtoolbox.surfmetrics"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.csv"]

[tool.setuptools.data-files]
"examples" = ["examples/example_growth_curve.xlsx",
              "examples/example_livedead.xlsx",
              "examples/README.md",
              "examples/README_livedead_counter.md"]
"data/examples" = ["data/examples/growth_Ecoli_example.csv",
                   "data/examples/livedead_example.xlsx"]